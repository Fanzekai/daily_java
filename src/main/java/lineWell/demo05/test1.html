<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成登记表 - 公文行政审批电子文件归档系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            font-size: 24px;
            color: #333;
            border-bottom: 2px solid #409EFF;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 16px;
            color: #555;
            display: inline-block;
            width: 120px;
        }
        input[type="text"], input[type="datetime-local"], select {
            width: calc(100% - 140px);
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #409EFF;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:disabled {
            background-color: #bfbfbf;
        }
        button.reset-btn {
            background-color: #f56c6c;
        }
        .response {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">生成登记表</div>
    <form id="generateForm">
        <div class="form-group">
            <label for="archiveState">归档状态：</label>
            <select id="archiveState" required>
                <option value="">请选择</option>
                <option value="待归档">待归档</option>
                <option value="已归档">已归档</option>
            </select>
        </div>
        <div class="form-group">
            <label for="startDate">开始时间：</label>
            <input type="datetime-local" id="startDate" required>
        </div>
        <div class="form-group">
            <label for="endDate">结束时间：</label>
            <input type="datetime-local" id="endDate" required>
        </div>
        <button type="submit">生成</button>
        <button type="reset" class="reset-btn">重置</button>
    </form>
    <div class="response" id="responseMessage"></div>
</div>

<script>
    document.getElementById('generateForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const archiveState = document.getElementById('archiveState').value;
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        if (!archiveState || !startDate || !endDate) {
            document.getElementById('responseMessage').textContent = "请填写所有必填项。";
            return;
        }

        document.getElementById('responseMessage').textContent = "登记表生成并上传成功。";
    });
</script>
</body>
</html>
